
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenny Growth Assistant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      color: #222;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button,
    select {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status {
      color: #555;
      min-height: 20px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    #answer {
      padding: 15px;
      background: #f2f2f2;
      white-space: pre-wrap;
      min-height: 250px;
      overflow-wrap: anywhere;
    }

    #artifactViewer {
      width: 100%;
      min-height: 400px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    #sources {
      margin-top: 20px;
    }

    .source-item {
      margin-bottom: 15px;
      padding: 10px;
      border-left: 4px solid #777;
      background: #f7f7f7;
      overflow-wrap: anywhere;
    }

    @media (max-width: 800px) {
      .result-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>Lenny Growth Assistant</h1>

  <p>Ask a product or growth question grounded in Lenny's transcript sources.</p>

  <p id="sessionInfo">Session: New session</p>
  <p id="providerInfo">Provider: Unknown</p>
  <p id="status" class="status" aria-live="polite"></p>

  <div class="controls">
    <select id="mode">
      <option value="chat">Normal Answer</option>
      <option value="essay">Ship 30 for 30 Essay</option>
    </select>

    <button id="newSessionButton" type="button">
      New Session
    </button>
  </div>

  <textarea
    id="message"
    placeholder="Type your question..."
  ></textarea>

  <br />

  <button id="askButton" type="button">
    Ask
  </button>

  <div class="result-grid">
    <div>
      <h3>Answer</h3>
      <div id="answer">Your answer will appear here.</div>
    </div>

    <div>
      <h3>Artifact Viewer</h3>
      <iframe
        id="artifactViewer"
        title="Generated artifact preview"
        sandbox="allow-scripts"
      ></iframe>
    </div>
  </div>

  <div id="sources"></div>

  <script>
    let sessionId = sessionStorage.getItem("lenny_session_id");

    if (sessionId === "undefined" || sessionId === "null") {
      sessionId = null;
    }

    const askButton = document.getElementById("askButton");
    const newSessionButton = document.getElementById("newSessionButton");
    const messageInput = document.getElementById("message");
    const answerBox = document.getElementById("answer");
    const statusBox = document.getElementById("status");
    const providerInfo = document.getElementById("providerInfo");
    const sessionInfo = document.getElementById("sessionInfo");
    const artifactViewer = document.getElementById("artifactViewer");
    const sourcesBox = document.getElementById("sources");

    function updateSessionDisplay() {
      sessionInfo.textContent = sessionId
        ? "Session: " + sessionId
        : "Session: New session";
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderAnswer(text) {
      const safeAnswer = escapeHtml(text);

      return safeAnswer
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/^## (.*)$/gm, "<h2>$1</h2>")
        .replace(/^# (.*)$/gm, "<h1>$1</h1>")
        .replace(/^- (.*)$/gm, "<li>$1</li>")
        .replace(/\n/g, "<br>");
    }

    function showEmptyArtifact() {
      artifactViewer.srcdoc = `
        <!DOCTYPE html>
        <html lang="en">
        <body style="font-family: Arial; padding: 20px;">
          <h2>Artifact Preview</h2>
          <p>No HTML artifact was generated for this response.</p>
        </body>
        </html>
      `;
    }

    function renderSources(sources) {
      sourcesBox.innerHTML = "<h3>Sources</h3>";

      if (!sources || sources.length === 0) {
        sourcesBox.innerHTML += "<p>No relevant sources were returned.</p>";
        return;
      }

      sources.forEach((source) => {
        const sourceItem = document.createElement("div");
        sourceItem.className = "source-item";

        const title = document.createElement("strong");
        title.textContent = source.title || "Unknown source";

        const id = document.createElement("div");
        id.textContent = "Source ID: " + (source.id || "Unknown");

        const url = document.createElement("div");
        url.textContent = "URL: " + (source.url || "No URL available");

        sourceItem.appendChild(title);
        sourceItem.appendChild(id);
        sourceItem.appendChild(url);

        sourcesBox.appendChild(sourceItem);
      });
    }

    function startNewSession() {
      sessionId = null;
      sessionStorage.removeItem("lenny_session_id");

      updateSessionDisplay();

      answerBox.textContent = "Your answer will appear here.";
      providerInfo.textContent = "Provider: Unknown";
      statusBox.textContent = "New session started.";
      messageInput.value = "";
      sourcesBox.innerHTML = "";
      showEmptyArtifact();
    }

    async function askQuestion() {
      const message = messageInput.value.trim();
      const mode = document.getElementById("mode").value;

      if (!message) {
        answerBox.textContent = "Please enter a question.";
        return;
      }

      askButton.disabled = true;
      newSessionButton.disabled = true;
      statusBox.textContent = "Thinking... Please wait.";
      answerBox.textContent = "Generating answer...";
      sourcesBox.innerHTML = "";

      try {
        const response = await fetch("http://127.0.0.1:8000/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message,
            session_id: sessionId,
            mode: mode
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("The server returned an invalid response.");
        }

        if (!response.ok) {
          throw new Error(data.detail || "Request failed.");
        }

        if (data.session_id) {
          sessionId = data.session_id;
          sessionStorage.setItem("lenny_session_id", sessionId);
          updateSessionDisplay();
        }

        providerInfo.textContent =
          "Provider: " + (data.provider || "Unknown");

        answerBox.innerHTML = renderAnswer(
          data.answer || "No answer was returned."
        );

        if (data.artifact) {
          artifactViewer.srcdoc = data.artifact;
        } else {
          showEmptyArtifact();
        }

        renderSources(data.sources || []);
        statusBox.textContent = "Response generated successfully.";
      } catch (error) {
        answerBox.textContent = "Error: " + error.message;
        statusBox.textContent =
          "The request could not be completed. Check that the backend is running.";
        showEmptyArtifact();
      } finally {
        askButton.disabled = false;
        newSessionButton.disabled = false;
      }
    }

    askButton.addEventListener("click", askQuestion);
    newSessionButton.addEventListener("click", startNewSession);

    updateSessionDisplay();
    showEmptyArtifact();
  </script>
</body>
</html>
